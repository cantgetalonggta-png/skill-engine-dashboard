<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Skill Engine Dashboard — Full Distillation</title>
<meta name="description" content="Autonomous skill-tree engine dashboard with master/learned trees, encyclopedia, insights, self-dev tracks, export tools."/>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--card:#151a21;--border:#2a3340;--text:#e8edf2;--muted:#8b97a8;--accent:#7c9cff;--radius:14px;--font:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--font);background:var(--bg);color:var(--text)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#0e1218;border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c9cff,#c39bff);display:grid;place-items:center;font-weight:800;color:#0b0d10}
.muted{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--text);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.nav:hover{background:#1a2130}.nav.active{background:#1a2436;border-color:var(--border);color:#fff}
.sidebar-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border);padding-top:12px}
.kpi-mini{text-align:center}.kpi-mini span{display:block;font-size:18px;font-weight:700}.kpi-mini label{font-size:10px;color:var(--muted);text-transform:uppercase}
.main{padding:20px 24px 40px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{margin:0 0 4px;font-size:22px;font-weight:650}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search,select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;min-width:140px}
.search{min-width:220px}
.btn{background:#1c2430;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:#3d4b5c;background:#222b3a}
.btn.primary{background:linear-gradient(135deg,#3d5cff,#6a5cff);border:none;color:#fff}
.linkish{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.span2{grid-column:span 2}.kpi .num{font-size:36px;font-weight:700;line-height:1.1}.kpi .lab{color:var(--muted);margin:4px 0 10px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center}
.bar-track{height:8px;background:#0f141b;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.blab{font-size:12px;text-transform:capitalize}.bnum{font-size:12px;color:var(--muted);text-align:right}
.insight-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.insight-list p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.check-list{margin:0;padding-left:18px;line-height:1.7;color:#c5ced9;font-size:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.tree-panel,.detail-panel{max-height:calc(100vh - 140px);overflow:auto}
.tree-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.tree-row:hover{background:#1a2130}.tree-row.selected{background:#1e2a40;outline:1px solid #334155}
.twisty{width:14px;color:var(--muted)}.tname{flex:1}
.count{font-size:11px;color:var(--muted);background:#0f141b;border-radius:99px;padding:1px 7px}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid;border-radius:99px;padding:2px 8px;white-space:nowrap}
.atom-card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.atom-card h3{margin:0;font-size:15px}
.atom-card .def{color:#c9d2de;font-size:13px;line-height:1.45;margin:0 0 8px}
.atom-card .purpose{font-size:13px;color:var(--muted);margin:0 0 12px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.meta-grid h4{margin:0 0 4px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.meta-grid ul{margin:0;padding-left:16px;color:#c5ced9}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:#0f141b;border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:11px;color:var(--muted)}
.atom-card footer{margin-top:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.atom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.insight-grid,.sd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.insight h3,.sd h3{margin:0 0 8px;font-size:15px}
.insight p,.sd p{margin:0 0 10px;color:#c5ced9;font-size:13px;line-height:1.5}
.insight footer{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.log-table{width:100%;border-collapse:collapse;font-size:13px}
.log-table th,.log-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.log-table th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.file-list{padding-left:18px;line-height:1.8}.file-list a{color:var(--accent);text-decoration:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:50;font-size:13px;display:none}
.toast.show{display:block}
.hidden{display:none!important}
@media(max-width:1100px){.grid-kpi{grid-template-columns:1fr 1fr}.split,.grid-2{grid-template-columns:1fr}}
@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.grid-kpi{grid-template-columns:1fr}.span2{grid-column:span 1}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">Σ</div>
      <div><strong>Skill Engine</strong><div class="muted" id="brand-sub">loading…</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="kpi-mini"><span id="k-atoms">—</span><label>atoms</label></div>
      <div class="kpi-mini"><span id="k-insights">—</span><label>insights</label></div>
      <div class="kpi-mini"><span id="k-domains">—</span><label>domains</label></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="page-title">Dashboard</h1><p class="muted" id="page-sub"></p></div>
      <div class="top-actions">
        <input class="search" id="search" placeholder="Search atoms, tags, definitions…" />
        <select id="domainFilter"><option value="all">All domains</option></select>
        <button class="btn" id="btnExport">Export JSON</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="./state.js"></script>
<script>
let STATE = null;
const SELF_DEV = [{"id": "sd_deliberate_practice", "domain": "Meta-Skills", "title": "Deliberate Practice Loops", "why": "Practice + feedback beats passive consumption for skill acquisition.", "practice": "Pick one atomic skill from the master tree. Design a 25-min focused drill with immediate scoring rubric.", "schedule": "Daily 25m + weekly review 45m", "metric": "Can-do statement: I can execute X without notes in under Y minutes", "prereq": "Clear SkillAtom definition", "time": "2\u20134 weeks per atom"}, {"id": "sd_spaced_rep", "domain": "Cognition", "title": "Spaced Repetition + Interleaving", "why": "Retention multiplies when retrieval is effortful and mixed across domains.", "practice": "Anki or free-recall cards for definitions, dependencies, and failure modes of top 20 atoms.", "schedule": "15m daily; interleave 3 domains", "metric": "90% recall at 7-day lag", "prereq": "Encyclopedia export", "time": "Ongoing"}, {"id": "sd_critical_chain", "domain": "Cognition", "title": "Critical Thinking Reasoning Chain", "why": "Maximum common sense + logic + critical thinking as ontological core.", "practice": "For any claim: premises \u2192 evidence \u2192 alternatives \u2192 conclusion checklist. Log 5 critiques/week.", "schedule": "3x/week on insights + project decisions", "metric": "Written critique notes with orphan/cycle detection", "prereq": "common-sense-logic-critical-thinking atom", "time": "1 week to habit"}, {"id": "sd_vite_ship", "domain": "Technical Practice", "title": "Ship Loop: Vite \u2192 Vercel", "why": "Close the loop from skill distillation to live product.", "practice": "Build one module per cycle; deploy; verify all buttons/routes; write change log.", "schedule": "Every engine cycle", "metric": "Live URL + green build + functional smoke checklist", "prereq": "vite + github/vercel connectors", "time": "1\u20132 days per major module"}, {"id": "sd_writing", "domain": "Communication", "title": "Coherent Communication Drills", "why": "Structured prose multiplies teaching and collaboration quality.", "practice": "Rewrite one encyclopedia entry into a 400-word teaching note with examples.", "schedule": "2x/week", "metric": "Peer or self-rubric score \u2265 4/5 on clarity and flow", "prereq": "coherent-communication skill", "time": "Ongoing"}, {"id": "sd_habit_review", "domain": "Professional Habits", "title": "Weekly Planning & Review", "why": "Track progress with concrete metrics and can-do statements.", "practice": "Sunday: plan 3 atoms. Friday: review metrics, promote/demote atoms on trees.", "schedule": "Weekly", "metric": "Completed can-do statements / planned", "prereq": "Dashboard log", "time": "60m/week"}, {"id": "sd_multi_agent", "domain": "Meta-Skills", "title": "Multi-Agent Distill\u2192Critique Chain", "why": "Parallel roles reduce blind spots: Distiller, Analyzer, Synthesizer, Ontologist, Inferencer, Critic, Upgrader.", "practice": "Run one multi-agent block on a new skill batch; merge; export.", "schedule": "Each engine cycle", "metric": "Zero unresolved critic findings after cycle", "prereq": "skill-tree-engine multi-agent mode", "time": "Per cycle"}, {"id": "sd_ethical_data", "domain": "Technical Practice", "title": "Ethical Public Data Harvest", "why": "Legal, rate-limited, ToS-respecting collection expands knowledge without risk.", "practice": "One scout\u2192parser\u2192validator pipeline on an open data portal.", "schedule": "Optional project weeks", "metric": "Documented compliance checklist + dataset manifest", "prereq": "ethical-data-harvesting", "time": "3\u20135 days per pipeline"}];
const TABS = [
  {id:'dashboard',label:'Dashboard',icon:'◈'},
  {id:'master',label:'Master Tree',icon:'🌳'},
  {id:'learned',label:'Learned Tree',icon:'🧠'},
  {id:'encyclopedia',label:'Encyclopedia',icon:'📖'},
  {id:'insights',label:'Insights',icon:'✨'},
  {id:'selfdev',label:'Self-Dev',icon:'🎯'},
  {id:'log',label:'Update Log',icon:'📋'},
  {id:'export',label:'Export / Tools',icon:'⚙'},
];
const domainColor = d => ({cognition:'#7c9cff',communication:'#7ddea8',technical:'#f0b27a',meta:'#c39bff',general:'#9aa4b2'}[d]||'#9aa4b2');
let tab='dashboard', q='', domainFilter='all', selectedAtom=null, selectedNodeId=null, sdDomain='all', openNodes=new Set(['root','learned_root','dom_cognition','dom_communication','dom_technical','dom_meta']);
let atoms={}, atomList=[], domains=[], eng={};

function flash(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}

function atomCard(a){
  return `<article class="atom-card card">
    <header><h3>${esc(a.name)}</h3><span class="badge" style="border-color:${domainColor(a.domain)};color:${domainColor(a.domain)}">${esc(a.domain)}</span></header>
    <p class="def">${esc(a.definition||'—')}</p>
    <p class="purpose"><strong>Purpose:</strong> ${esc(a.purpose||'—')}</p>
    <div class="meta-grid">
      <div><h4>Inputs</h4><ul>${(a.inputs||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
      <div><h4>Outputs</h4><ul>${(a.outputs||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
      <div><h4>Dependencies</h4><ul>${(a.dependencies||[]).length?(a.dependencies||[]).map(x=>`<li>${esc(x)}</li>`).join(''):'<li>—</li>'}</ul></div>
      <div><h4>Tags</h4><div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>
    </div>
    <footer><code>${esc(a.id)}</code><span>v${a.version??1}</span></footer>
  </article>`;
}

function renderTree(node, depth=0){
  const hasKids=(node.children||[]).length>0;
  const isOpen=openNodes.has(node.id)||depth<1;
  const atom=node.atomId?atoms[node.atomId]:null;
  let html=`<div class="tree-node" style="margin-left:${depth?12:0}px">
    <div class="tree-row ${selectedNodeId===node.id?'selected':''}" data-node="${esc(node.id)}" data-atom="${esc(node.atomId||'')}" data-has-kids="${hasKids}">
      <span class="twisty">${hasKids?(isOpen?'▾':'▸'):'·'}</span>
      <span class="tname">${esc(node.name)}</span>
      ${atom?`<span class="badge" style="border-color:${domainColor(atom.domain)};color:${domainColor(atom.domain)}">${esc(atom.domain)}</span>`:''}
      ${hasKids?`<span class="count">${node.children.length}</span>`:''}
    </div>`;
  if(isOpen&&hasKids) html+=node.children.map(c=>renderTree(c,depth+1)).join('');
  return html+`</div>`;
}

function filteredAtoms(){
  const qq=q.trim().toLowerCase();
  return atomList.filter(a=>{
    if(domainFilter!=='all'&&a.domain!==domainFilter) return false;
    if(!qq) return true;
    return a.name.toLowerCase().includes(qq)||a.id.toLowerCase().includes(qq)||(a.definition||'').toLowerCase().includes(qq)||(a.tags||[]).some(t=>t.toLowerCase().includes(qq));
  });
}

function render(){
  document.getElementById('brand-sub').textContent=`v${eng.version} · cycle ${eng.cycle}`;
  document.getElementById('k-atoms').textContent=Object.keys(atoms).length;
  document.getElementById('k-insights').textContent=(STATE.insights||[]).length;
  document.getElementById('k-domains').textContent=domains.length;
  document.getElementById('page-title').textContent=TABS.find(t=>t.id===tab)?.label||tab;
  document.getElementById('page-sub').textContent=`Updated ${eng.updatedAt?new Date(eng.updatedAt).toLocaleString():'—'} · modes: ${(eng.modes||[]).join(' · ')}`;

  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(t=>`<button class="nav ${tab===t.id?'active':''}" data-tab="${t.id}" type="button"><span>${t.icon}</span>${t.label}</button>`).join('');

  const df=document.getElementById('domainFilter');
  df.innerHTML=`<option value="all">All domains</option>`+domains.map(d=>`<option value="${d}">${d}</option>`).join('');
  df.value=domainFilter;

  const view=document.getElementById('view');
  if(tab==='dashboard'){
    const counts=Object.fromEntries(domains.map(d=>[d,atomList.filter(a=>a.domain===d).length]));
    view.innerHTML=`
    <section class="grid-kpi">
      <div class="card kpi"><div class="num">${Object.keys(atoms).length}</div><div class="lab">Skill Atoms</div><button class="linkish" data-goto="encyclopedia">Open encyclopedia →</button></div>
      <div class="card kpi"><div class="num">${eng.cycle}</div><div class="lab">Engine Cycle</div><button class="linkish" data-goto="log">View log →</button></div>
      <div class="card kpi"><div class="num">${(STATE.insights||[]).length}</div><div class="lab">Emergent Insights</div><button class="linkish" data-goto="insights">Read insights →</button></div>
      <div class="card kpi"><div class="num">${SELF_DEV.length}</div><div class="lab">Self-Dev Tracks</div><button class="linkish" data-goto="selfdev">Practice plans →</button></div>
      <div class="card span2"><h2>Domain distribution</h2><div class="bars">${domains.map(d=>{const n=counts[d];const pct=Math.round(n/Math.max(atomList.length,1)*100);return`<div class="bar-row"><span class="blab" style="color:${domainColor(d)}">${d}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${domainColor(d)}"></div></div><span class="bnum">${n} (${pct}%)</span></div>`}).join('')}</div></div>
      <div class="card span2"><h2>Latest insights</h2><ul class="insight-list">${(STATE.insights||[]).slice(-6).reverse().map(ins=>`<li><strong>${esc(ins.title)}</strong><p>${esc((ins.body||'').slice(0,180))}${(ins.body||'').length>180?'…':''}</p></li>`).join('')}</ul>
        <div class="row-actions">
          <button class="btn primary" data-goto="master">Explore Master Tree</button>
          <button class="btn" id="btnCritique">Run Local Critique</button>
          <button class="btn" id="btnCopy">Copy Summary</button>
        </div>
      </div>
      <div class="card span2"><h2>Session enhancements (vs base Grok)</h2>
        <ul class="check-list">
          <li><strong>50+ server-skill packages</strong> distilled into SkillAtoms (cognition / communication / technical / meta)</li>
          <li><strong>skill-tree-engine</strong> with live state, master/learned trees, encyclopedia, insights, cycle log</li>
          <li><strong>self-dev-resources</strong> practice tracks with schedules & can-do metrics</li>
          <li><strong>Connected tools:</strong> Vercel deploy, GitHub, Google Drive, Voice, Automations, HyperFrames</li>
          <li><strong>Sandbox computer</strong> + Imagine media suite + multi-agent orchestration</li>
          <li><strong>High-effort modes</strong> (/Xhigh /effort-100 /online) + full-approval autonomous multi-run</li>
          <li><strong>Live dashboard</strong> with all modules, search, filters, export, smoke tests, tree navigation</li>
          <li>Base Grok: no server-skills pack, no skill ontology loop, no Vercel/GitHub MCP deploy chain</li>
        </ul>
      </div>
    </section>`;
  } else if(tab==='master'||tab==='learned'){
    const tree=tab==='master'?STATE.masterSkillsTree:STATE.learnedKnowledgeTree;
    view.innerHTML=`<section class="split">
      <div class="card tree-panel"><h2>${tab==='master'?'Master Skills Tree':'Learned Knowledge Tree'}</h2>${renderTree(tree)}</div>
      <div class="card detail-panel"><h2>Selection</h2>${selectedAtom?atomCard(selectedAtom):'<p class="muted">Select a leaf skill atom from the tree.</p>'}</div>
    </section>`;
  } else if(tab==='encyclopedia'){
    const list=filteredAtoms();
    view.innerHTML=`<div class="toolbar"><span class="muted">Showing ${list.length} / ${atomList.length} atoms</span>
      <button class="btn" id="btnClear">Clear filters</button></div>
      <div class="atom-grid">${list.map(a=>`<div data-pick="${esc(a.id)}">${atomCard(a)}</div>`).join('')}</div>`;
  } else if(tab==='insights'){
    view.innerHTML=`<section class="insight-grid">${(STATE.insights||[]).slice().reverse().map(ins=>`<article class="card insight"><h3>${esc(ins.title)}</h3><p>${esc(ins.body)}</p><footer><span>cycle ${ins.cycle??'—'}</span><span>${esc((ins.relatedAtoms||[]).slice(0,4).join(', ')||'—')}</span></footer></article>`).join('')}</section>`;
  } else if(tab==='selfdev'){
    const list=SELF_DEV.filter(r=>sdDomain==='all'||r.domain===sdDomain);
    const sdd=[...new Set(SELF_DEV.map(r=>r.domain))];
    view.innerHTML=`<div class="toolbar">
      <select id="sdDomain">${['all',...sdd].map(d=>`<option value="${d}" ${sdDomain===d?'selected':''}>${d==='all'?'All domains':d}</option>`).join('')}</select>
      <button class="btn primary" id="btnPlan">Activate Weekly Plan</button>
    </div>
    <div class="sd-grid">${list.map(r=>`<article class="card sd">
      <span class="badge" style="border-color:#7ddea8;color:#7ddea8">${esc(r.domain)}</span>
      <h3>${esc(r.title)}</h3>
      <p><strong>Why:</strong> ${esc(r.why)}</p>
      <p><strong>Practice:</strong> ${esc(r.practice)}</p>
      <p><strong>Schedule:</strong> ${esc(r.schedule)}</p>
      <p><strong>Metric:</strong> ${esc(r.metric)}</p>
      <p class="muted">Prereq: ${esc(r.prereq)} · Time: ${esc(r.time)}</p>
      <button class="btn track-btn" data-track="${esc(r.title)}">Track this skill</button>
    </article>`).join('')}</div>`;
  } else if(tab==='log'){
    const log=(STATE.log||[]).slice().reverse();
    view.innerHTML=`<section class="card"><h2>Update Log</h2>
      <table class="log-table"><thead><tr><th>Cycle</th><th>Added</th><th>Updated</th><th>Insights</th><th>Note</th><th>At</th></tr></thead>
      <tbody>${log.map(r=>`<tr><td>${r.cycle}</td><td>${r.added}</td><td>${r.updated}</td><td>${r.insights}</td><td>${esc(r.note)}</td><td>${r.at?new Date(r.at).toLocaleString():'—'}</td></tr>`).join('')}</tbody></table>
      ${(eng.upgrades||[]).length?`<h3 style="margin-top:24px">Engine upgrades</h3><ul>${eng.upgrades.map(u=>`<li>Cycle ${u.cycle}: ${esc(u.note)}</li>`).join('')}</ul>`:''}
    </section>`;
  } else if(tab==='export'){
    view.innerHTML=`<section class="grid-2">
      <div class="card"><h2>Export & share</h2>
        <p class="muted">Download the full JSON super-object or open markdown reports.</p>
        <div class="row-actions">
          <button class="btn primary" id="btnDl">Download state.json</button>
          <button class="btn" id="btnCopy2">Copy summary</button>
          <a class="btn" href="/MASTERSKILLSENCYCLOPEDIA.md" target="_blank">Encyclopedia MD</a>
          <a class="btn" href="/EMERGENTINSIGHTSREPORT.md" target="_blank">Insights MD</a>
        </div>
      </div>
      <div class="card"><h2>Verification tools</h2>
        <p class="muted">Critical thinking + common sense checklist against live state.</p>
        <div class="row-actions">
          <button class="btn" id="btnCritique2">Run critic</button>
          <button class="btn" id="btnSmoke">Smoke test</button>
          <button class="btn" id="btnMods">Module inventory</button>
        </div>
        <h3 style="margin-top:20px">Linked data</h3>
        <ul class="file-list">
          <li><a href="/state.json" target="_blank">/state.json</a></li>
          <li><a href="/MASTERSKILLSTREE.md" target="_blank">Master Skills Tree</a></li>
          <li><a href="/LEARNEDKNOWLEDGETREE.md" target="_blank">Learned Knowledge Tree</a></li>
          <li><a href="/UPDATE_LOG.md" target="_blank">Update Log</a></li>
          <li><a href="/engine-dashboard.html" target="_blank">Engine mini-dashboard</a></li>
        </ul>
      </div>
      <div class="card span2"><h2>Absolute distillation status</h2>
        <p>Cycle <strong>${eng.cycle}</strong> distilled <strong>${Object.keys(atoms).length}</strong> skills across <strong>${domains.join(', ')}</strong>.
        Self-dev tracks: ${SELF_DEV.length}. Autonomous multi-run mode active. Deploy target: Vercel production (static).</p>
      </div>
    </section>`;
  }
  bind();
}

function downloadJson(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`skill-engine-state-cycle-${eng.cycle}.json`;a.click();
  URL.revokeObjectURL(url);flash('State JSON downloaded');
}
function copySummary(){
  const text=[`Skill Engine v${eng.version} · Cycle ${eng.cycle}`,`Atoms: ${Object.keys(atoms).length}`,`Insights: ${(STATE.insights||[]).length}`,`Modes: ${(eng.modes||[]).join(', ')}`,`Updated: ${eng.updatedAt||'—'}`,''].concat((STATE.insights||[]).slice(-5).map(i=>'• '+i.title)).join('\n');
  navigator.clipboard?.writeText(text).then(()=>flash('Summary copied')).catch(()=>flash('Clipboard unavailable'));
}
function runCritique(){
  const orphans=atomList.filter(a=>!(a.definition||'').trim()).length;
  const noTags=atomList.filter(a=>!(a.tags||[]).length).length;
  flash(`Critique: ${orphans} empty definitions · ${noTags} untagged · ${(STATE.critic||[]).length} stored findings`);
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});
  document.querySelectorAll('.tree-row').forEach(row=>{
    row.onclick=()=>{
      const id=row.dataset.node;
      const aid=row.dataset.atom;
      const hasKids=row.dataset.hasKids==='true';
      if(hasKids){if(openNodes.has(id))openNodes.delete(id);else openNodes.add(id)}
      selectedNodeId=id;
      selectedAtom=aid&&atoms[aid]?atoms[aid]:null;
      render();
    };
  });
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{selectedAtom=atoms[el.dataset.pick];flash('Selected '+selectedAtom.name)});
  document.querySelectorAll('.track-btn').forEach(b=>b.onclick=()=>flash('Tracked: '+b.dataset.track));
  const sc=document.getElementById('btnCritique');if(sc)sc.onclick=runCritique;
  const sc2=document.getElementById('btnCritique2');if(sc2)sc2.onclick=runCritique;
  const cp=document.getElementById('btnCopy');if(cp)cp.onclick=copySummary;
  const cp2=document.getElementById('btnCopy2');if(cp2)cp2.onclick=copySummary;
  const dl=document.getElementById('btnDl');if(dl)dl.onclick=downloadJson;
  const cl=document.getElementById('btnClear');if(cl)cl.onclick=()=>{q='';domainFilter='all';document.getElementById('search').value='';render()};
  const pl=document.getElementById('btnPlan');if(pl)pl.onclick=()=>flash('Practice plan activated for next weekly review');
  const sm=document.getElementById('btnSmoke');if(sm)sm.onclick=()=>{const ok=Object.keys(atoms).length>=50&&(STATE.insights||[]).length>=3;flash(ok?'Smoke check PASSED (atoms≥50, insights≥3)':'Smoke check FAILED')};
  const mo=document.getElementById('btnMods');if(mo)mo.onclick=()=>flash('All modules reachable: dashboard, trees, encyclopedia, insights, self-dev, log, export');
  const sdd=document.getElementById('sdDomain');if(sdd)sdd.onchange=e=>{sdDomain=e.target.value;render()};
}

document.getElementById('btnExport').onclick=downloadJson;
document.getElementById('search').oninput=e=>{q=e.target.value;if(tab==='encyclopedia')render()};
document.getElementById('domainFilter').onchange=e=>{domainFilter=e.target.value;if(tab==='encyclopedia'||tab==='dashboard')render()};

// Boot: load state.json then render
document.getElementById('view').innerHTML='<div class="card">Loading skill engine state…</div>';
(async function boot(){
  let j = window.__SKILL_STATE || null;
  let last=null;
  if (!j) {
    const urls=['./state.json','https://cdn.jsdelivr.net/gh/cantgetalonggta-png/skill-engine-dashboard@main/state.json'];
    for (const u of urls) {
      try {
        const r = await fetch(u, {cache:'no-store'});
        if (!r.ok) throw new Error(u+' '+r.status);
        j = await r.json();
        break;
      } catch (e) { last = e; }
    }
  }
  if (!j) {
    document.getElementById('view').innerHTML=`<div class="card"><h2>Failed to load state</h2><p>${esc(String(last&&last.message||last))}</p></div>`;
    return;
  }
  STATE=j;
  atoms=STATE.atoms||{};
  atomList=Object.values(atoms).sort((a,b)=>a.name.localeCompare(b.name));
  domains=[...new Set(atomList.map(a=>a.domain))].sort();
  eng=STATE.engine||{version:'?',cycle:0,modes:[]};
  render();
})();
</script>
</body>
</html>
